<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bar 8 Darts</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; transition: background-color 0.3s ease; }
        .dark body { background-color: #020617; } /* slate-950 */
        body { background-color: #f8fafc; } /* slate-50 */
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Target = ({ className }) => <Icon className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>;
        const Trophy = ({ className }) => <Icon className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></Icon>;
        const RotateCcw = ({ className }) => <Icon className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></Icon>;
        const Undo2 = ({ className }) => <Icon className={className}><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></Icon>;
        const Settings = ({ className }) => <Icon className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>;
        const Users = ({ className }) => <Icon className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
        const ArrowRight = ({ className }) => <Icon className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
        const Activity = ({ className }) => <Icon className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Icon>;
        const Download = ({ className }) => <Icon className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Icon>;
        const Plus = ({ className }) => <Icon className={className}><path d="M5 12h14"/><path d="M12 5v14"/></Icon>;
        const Trash2 = ({ className }) => <Icon className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
        const Keyboard = ({ className }) => <Icon className={className}><path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></Icon>;
        const Database = ({ className }) => <Icon className={className}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></Icon>;
        const ChevronLeft = ({ className }) => <Icon className={className}><path d="m15 18-6-6 6-6"/></Icon>;
        const Sun = ({ className }) => <Icon className={className}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></Icon>;
        const Moon = ({ className }) => <Icon className={className}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></Icon>;
        const Edit3 = ({ className }) => <Icon className={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></Icon>;

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        }

        const DEFAULT_TEAMS = [
            { id: 1, name: 'Bar 8' },
            { id: 2, name: 'Arrows FC' },
            { id: 3, name: 'The Bulls' },
            { id: 4, name: 'M.C.C.D.T' }
        ];

        const DEFAULT_STATS = { darts: 0, total: 0, high: 0, tons: 0, tonForties: 0, oneEighties: 0, legStats: { total: 0, darts: 0 } };
        const INVALID_SCORES = [163, 166, 169, 172, 175, 178, 179];

        const isValidScore = (score) => {
            if (isNaN(score) || score < 0 || score > 180) return false;
            if (INVALID_SCORES.includes(score)) return false;
            return true;
        };

        const calculateAverage = (total, darts) => {
            if (darts === 0) return "0.00";
            return ((total / darts) * 3).toFixed(2);
        };

        const Bar8DartsDashboard = () => {
            const [appState, setAppState] = useState('setup'); // setup, teams, match, archive
            const [isDarkMode, setIsDarkMode] = useLocalStorage('bar8_theme', false);
            
            // Persistent Data
            const [teams, setTeams] = useLocalStorage('bar8_teams', DEFAULT_TEAMS);
            const [matchArchive, setMatchArchive] = useLocalStorage('bar8_archive', []);
            const [newTeamName, setNewTeamName] = useState('');

            // Match Configuration
            const [config, setConfig] = useState({
                startingScore: 501,
                bestOf: 3,
                team1Id: 1,
                team2Id: 2
            });

            // Active Match State
            const [players, setPlayers] = useState([]);
            const [currentPlayerIdx, setCurrentPlayerIdx] = useState(0);
            const [legStartingIdx, setLegStartingIdx] = useState(0);
            
            // Ledger & Leg History
            const [p1Turns, setP1Turns] = useState([]);
            const [p2Turns, setP2Turns] = useState([]);
            const [completedLegs, setCompletedLegs] = useState([]);

            // UI State
            const [inputValue, setInputValue] = useState('');
            const [history, setHistory] = useState([]);
            const [checkoutPrompt, setCheckoutPrompt] = useState(null);
            const [legWonOverlay, setLegWonOverlay] = useState(null);
            const [matchWinner, setMatchWinner] = useState(null);
            
            // Edit Overlay State
            const [editingModal, setEditingModal] = useState(null); 
            const [editInputValue, setEditInputValue] = useState('');
            
            const matchContainerRef = useRef(null);
            const ledgerEndRef = useRef(null);

            useEffect(() => {
                const root = document.documentElement;
                if (isDarkMode) root.classList.add('dark');
                else root.classList.remove('dark');
            }, [isDarkMode]);

            useEffect(() => {
                if (appState === 'match' && matchContainerRef.current && !editingModal) {
                    matchContainerRef.current.focus();
                }
            }, [appState, checkoutPrompt, legWonOverlay, matchWinner, editingModal]);

            useEffect(() => {
                if (ledgerEndRef.current) ledgerEndRef.current.scrollIntoView({ behavior: 'smooth' });
            }, [p1Turns, p2Turns]);

            const handleAddTeam = (e) => {
                e.preventDefault();
                if (!newTeamName.trim()) return;
                const newId = teams.length > 0 ? Math.max(...teams.map(t => t.id)) + 1 : 1;
                setTeams([...teams, { id: newId, name: newTeamName.trim() }]);
                setNewTeamName('');
            };

            const handleRemoveTeam = (id) => {
                if (teams.length <= 2) {
                    alert("You need at least 2 teams to play a match.");
                    return;
                }
                setTeams(teams.filter(t => t.id !== id));
                if (config.team1Id === id) setConfig({ ...config, team1Id: teams.find(t => t.id !== id)?.id || 1 });
                if (config.team2Id === id) setConfig({ ...config, team2Id: teams.find(t => t.id !== id)?.id || 2 });
            };

            const resetTeamsToDefault = () => {
                if (window.confirm("Restore the default league teams? Custom teams will be lost.")) {
                    setTeams(DEFAULT_TEAMS);
                }
            };

            const clearAllTeams = () => {
                if (window.confirm("Remove ALL teams? You will need to add new ones to play.")) {
                    setTeams([]);
                }
            };

            const clearArchive = () => {
                if (window.confirm("Are you sure you want to delete all saved matches? This cannot be undone.")) {
                    setMatchArchive([]);
                }
            };

            const startMatch = () => {
                const t1 = teams.find(t => t.id === config.team1Id) || teams[0];
                const t2 = teams.find(t => t.id === config.team2Id) || teams[1];

                if (!t1 || !t2) {
                    alert("Please select valid teams. Add teams if none exist.");
                    return;
                }
                if (t1.id === t2.id) {
                    alert("Please select two different teams.");
                    return;
                }
                if (config.startingScore <= 1 || isNaN(config.startingScore)) {
                    alert("Please enter a valid starting score.");
                    return;
                }

                setPlayers([
                    { id: t1.id, name: t1.name, score: config.startingScore, legs: 0, stats: JSON.parse(JSON.stringify(DEFAULT_STATS)) },
                    { id: t2.id, name: t2.name, score: config.startingScore, legs: 0, stats: JSON.parse(JSON.stringify(DEFAULT_STATS)) }
                ]);
                setCurrentPlayerIdx(0);
                setLegStartingIdx(0);
                setP1Turns([]);
                setP2Turns([]);
                setCompletedLegs([]);
                setHistory([]);
                setInputValue('');
                setCheckoutPrompt(null);
                setLegWonOverlay(null);
                setMatchWinner(null);
                setEditingModal(null);
                setAppState('match');
            };

            const saveHistoryState = () => {
                setHistory(prev => [...prev, {
                    players: JSON.parse(JSON.stringify(players)),
                    currentPlayerIdx,
                    legStartingIdx,
                    p1Turns: [...p1Turns],
                    p2Turns: [...p2Turns],
                    completedLegs: [...completedLegs]
                }]);
            };

            const handleUndo = () => {
                if (history.length === 0) return;
                const lastState = history[history.length - 1];
                setPlayers(lastState.players);
                setCurrentPlayerIdx(lastState.currentPlayerIdx);
                setLegStartingIdx(lastState.legStartingIdx);
                setP1Turns(lastState.p1Turns);
                setP2Turns(lastState.p2Turns);
                setCompletedLegs(lastState.completedLegs);
                setHistory(history.slice(0, -1));
                setInputValue('');
                setCheckoutPrompt(null);
                if (matchContainerRef.current) matchContainerRef.current.focus();
            };

            const getRebuiltStats = (pIdx, currentLegStats, legsArray) => {
                let stats = { darts: 0, total: 0, high: 0, tons: 0, tonForties: 0, oneEighties: 0, legStats: { total: 0, darts: 0 } };
                
                legsArray.forEach(leg => {
                    const turns = pIdx === 0 ? leg.p1Turns : leg.p2Turns;
                    turns.forEach(t => {
                        const darts = t.checkoutDarts || 3;
                        const score = (t.isBust || t.scored === 'BUST') ? 0 : t.intendedScore;
                        stats.darts += darts;
                        stats.total += score;
                        if (score > stats.high) stats.high = score;
                        if (score >= 100 && score <= 139) stats.tons++;
                        if (score >= 140 && score <= 179) stats.tonForties++;
                        if (score === 180) stats.oneEighties++;
                    });
                });
                
                stats.darts += currentLegStats.darts;
                stats.total += currentLegStats.total;
                if (currentLegStats.high > stats.high) stats.high = currentLegStats.high;
                stats.tons += currentLegStats.tons;
                stats.tonForties += currentLegStats.tonForties;
                stats.oneEighties += currentLegStats.oneEighties;
                
                stats.legStats = { total: currentLegStats.total, darts: currentLegStats.darts };
                return stats;
            };

            const recalculateAndSetState = (rawP1, rawP2) => {
                let p1Score = config.startingScore;
                let p2Score = config.startingScore;
                let newP1Turns = [];
                let newP2Turns = [];
                let p1LegStats = { total: 0, darts: 0, tons: 0, tonForties: 0, oneEighties: 0, high: 0 };
                let p2LegStats = { total: 0, darts: 0, tons: 0, tonForties: 0, oneEighties: 0, high: 0 };
                
                let currentPIdx = legStartingIdx;
                let p1Iter = 0;
                let p2Iter = 0;
                let hitCheckout = null;

                const processTurn = (rawScore, pScore, legStats, newTurnsArr, existingTurns, iter) => {
                    let remaining = pScore - rawScore;
                    let isBust = false;
                    let toGo = remaining;
                    let statScore = rawScore;
                    
                    if (remaining < 0 || remaining === 1) {
                        isBust = true;
                        toGo = pScore;
                        statScore = 0;
                    } else if (remaining === 0) {
                        return { isWin: true, statScore, rawScore, cDarts: (existingTurns[iter] && existingTurns[iter].checkoutDarts) ? existingTurns[iter].checkoutDarts : null }; 
                    }
                    
                    newTurnsArr.push({ scored: isBust ? 'BUST' : rawScore, intendedScore: rawScore, toGo, isBust });
                    
                    legStats.darts += 3;
                    legStats.total += statScore;
                    if (statScore > legStats.high) legStats.high = statScore;
                    if (statScore >= 100 && statScore <= 139) legStats.tons++;
                    if (statScore >= 140 && statScore <= 179) legStats.tonForties++;
                    if (statScore === 180) legStats.oneEighties++;
                    
                    return { isWin: false, toGo };
                };

                while (p1Iter < rawP1.length || p2Iter < rawP2.length) {
                    if (currentPIdx === 0 && p1Iter < rawP1.length) {
                        let res = processTurn(rawP1[p1Iter], p1Score, p1LegStats, newP1Turns, p1Turns, p1Iter);
                        if (res.isWin) {
                            hitCheckout = { playerIdx: 0, score: res.rawScore, knownDarts: res.cDarts };
                            p1Score = 0;
                            break;
                        }
                        p1Score = res.toGo;
                        p1Iter++;
                        currentPIdx = 1;
                    } else if (currentPIdx === 1 && p2Iter < rawP2.length) {
                        let res = processTurn(rawP2[p2Iter], p2Score, p2LegStats, newP2Turns, p2Turns, p2Iter);
                        if (res.isWin) {
                            hitCheckout = { playerIdx: 1, score: res.rawScore, knownDarts: res.cDarts };
                            p2Score = 0;
                            break;
                        }
                        p2Score = res.toGo;
                        p2Iter++;
                        currentPIdx = 0;
                    } else {
                        currentPIdx = currentPIdx === 0 ? 1 : 0;
                    }
                }

                const updatedPlayers = JSON.parse(JSON.stringify(players));
                updatedPlayers[0].score = p1Score;
                updatedPlayers[1].score = p2Score;
                updatedPlayers[0].stats = getRebuiltStats(0, p1LegStats, completedLegs);
                updatedPlayers[1].stats = getRebuiltStats(1, p2LegStats, completedLegs);

                setP1Turns(newP1Turns);
                setP2Turns(newP2Turns);
                setPlayers(updatedPlayers);
                setCurrentPlayerIdx(hitCheckout ? hitCheckout.playerIdx : currentPIdx);

                if (hitCheckout) setCheckoutPrompt({ score: hitCheckout.score });
                else setCheckoutPrompt(null);
            };

            const handleScoreSubmit = () => {
                if (inputValue === '') return;
                const score = parseInt(inputValue, 10);

                if (!isValidScore(score)) {
                    setInputValue(''); 
                    return; 
                }

                saveHistoryState();
                const rawP1 = p1Turns.map(t => t.intendedScore);
                const rawP2 = p2Turns.map(t => t.intendedScore);
                
                if (currentPlayerIdx === 0) rawP1.push(score);
                else rawP2.push(score);

                setInputValue('');
                recalculateAndSetState(rawP1, rawP2);
            };

            const submitEdit = () => {
                if (editInputValue === '') return;
                const newScore = parseInt(editInputValue, 10);
                if (!isValidScore(newScore)) return;

                saveHistoryState();
                const rawP1 = p1Turns.map(t => t.intendedScore);
                const rawP2 = p2Turns.map(t => t.intendedScore);
                
                if (editingModal.pIdx === 0) rawP1[editingModal.tIdx] = newScore;
                else rawP2[editingModal.tIdx] = newScore;
                
                setEditingModal(null);
                setEditInputValue('');
                recalculateAndSetState(rawP1, rawP2);
            };

            const handleCheckout = (dartsThrown) => {
                const score = checkoutPrompt.score;
                const activePIdx = currentPlayerIdx;
                
                const finalTurn = { scored: score, intendedScore: score, toGo: 0, isBust: false, checkoutDarts: dartsThrown };
                
                let finalP1Turns = [...p1Turns];
                let finalP2Turns = [...p2Turns];
                if (activePIdx === 0) finalP1Turns.push(finalTurn);
                else finalP2Turns.push(finalTurn);
                
                const getLegStat = (turns) => {
                    let tot = 0; let d = 0;
                    turns.forEach(t => {
                        d += (t.checkoutDarts || 3);
                        tot += (t.isBust || t.scored === 'BUST') ? 0 : t.intendedScore;
                    });
                    return { total: tot, darts: d };
                };
                
                const p1L = getLegStat(finalP1Turns);
                const p2L = getLegStat(finalP2Turns);
                
                const legRecord = {
                    legNum: completedLegs.length + 1,
                    starterIdx: legStartingIdx,
                    winnerIdx: activePIdx,
                    p1Darts: p1L.darts,
                    p1Avg: calculateAverage(p1L.total, p1L.darts),
                    p2Darts: p2L.darts,
                    p2Avg: calculateAverage(p2L.total, p2L.darts),
                    p1Turns: finalP1Turns,
                    p2Turns: finalP2Turns,
                    startScore: config.startingScore
                };
                
                const newCompletedLegs = [...completedLegs, legRecord];
                setCompletedLegs(newCompletedLegs);

                const updatedPlayers = JSON.parse(JSON.stringify(players));
                updatedPlayers[activePIdx].legs += 1;
                
                updatedPlayers[0].stats = getRebuiltStats(0, {total:0, darts:0, tons:0, tonForties:0, oneEighties:0, high:0}, newCompletedLegs);
                updatedPlayers[1].stats = getRebuiltStats(1, {total:0, darts:0, tons:0, tonForties:0, oneEighties:0, high:0}, newCompletedLegs);
                
                const isMatchWin = updatedPlayers[activePIdx].legs >= (Math.floor(Number(config.bestOf) / 2) + 1);

                setPlayers(updatedPlayers);
                if (activePIdx === 0) setP1Turns(finalP1Turns);
                else setP2Turns(finalP2Turns);
                
                setCheckoutPrompt(null);
                setInputValue('');

                setLegWonOverlay({
                    winnerName: updatedPlayers[activePIdx].name,
                    darts: activePIdx === 0 ? p1L.darts : p2L.darts,
                    isMatchWin: isMatchWin,
                    updatedPlayers: updatedPlayers,
                    newCompletedLegs: newCompletedLegs
                });
            };

            const handleNextLegOrMatch = () => {
                const { isMatchWin, updatedPlayers, newCompletedLegs } = legWonOverlay;
                
                if (isMatchWin) {
                    const matchRecord = {
                        id: Date.now(),
                        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
                        format: `Best of ${config.bestOf} (${config.startingScore})`,
                        startScore: config.startingScore,
                        p1Name: updatedPlayers[0].name,
                        p2Name: updatedPlayers[1].name,
                        p1Legs: updatedPlayers[0].legs,
                        p2Legs: updatedPlayers[1].legs,
                        p1Avg: calculateAverage(updatedPlayers[0].stats.total, updatedPlayers[0].stats.darts),
                        p2Avg: calculateAverage(updatedPlayers[1].stats.total, updatedPlayers[1].stats.darts),
                        legs: newCompletedLegs
                    };
                    setMatchArchive([...matchArchive, matchRecord]);
                    setMatchWinner(updatedPlayers[currentPlayerIdx]);
                } else {
                    updatedPlayers[0].score = config.startingScore;
                    updatedPlayers[1].score = config.startingScore;
                    updatedPlayers[0].stats.legStats = { total: 0, darts: 0 };
                    updatedPlayers[1].stats.legStats = { total: 0, darts: 0 };
                    
                    const nextLegStarter = legStartingIdx === 0 ? 1 : 0;
                    setLegStartingIdx(nextLegStarter);
                    setCurrentPlayerIdx(nextLegStarter);
                    setPlayers(updatedPlayers);
                    setP1Turns([]);
                    setP2Turns([]);
                    setHistory([]);
                }
                setLegWonOverlay(null);
                if (matchContainerRef.current) matchContainerRef.current.focus();
            };

            const handleNumpad = (val) => {
                if (inputValue.length < 3) setInputValue(prev => prev + val);
                if (matchContainerRef.current) matchContainerRef.current.focus();
            };
            
            const handleEditNumpad = (val) => {
                if (editInputValue.length < 3) setEditInputValue(prev => prev + val);
            };

            const handleKeyDown = (e) => {
                if (appState !== 'match' || matchWinner) return;

                if (legWonOverlay) {
                    if (e.key === 'Enter') handleNextLegOrMatch();
                    return;
                }
                
                if (editingModal) {
                    if (e.key >= '0' && e.key <= '9') {
                        setEditInputValue(prev => (prev.length < 3 ? prev + e.key : prev));
                    } else if (e.key === 'Enter') {
                        submitEdit();
                    } else if (e.key === 'Backspace') {
                        setEditInputValue(prev => prev.slice(0, -1));
                    } else if (e.key === 'Escape') {
                        setEditingModal(null);
                    }
                    return;
                }

                if (checkoutPrompt) {
                    if (['1', '2', '3'].includes(e.key)) handleCheckout(parseInt(e.key, 10));
                    else if (e.key === 'Backspace' || e.key === 'Escape') handleUndo();
                    return;
                }

                if (e.key >= '0' && e.key <= '9') {
                    setInputValue(prev => (prev.length < 3 ? prev + e.key : prev));
                } else if (e.key === 'Enter') {
                    handleScoreSubmit();
                } else if (e.key === 'Backspace') {
                    setInputValue(prev => prev.slice(0, -1));
                } else if (e.key === 'Escape' || e.key === 'Delete') {
                    setInputValue('');
                } else if (e.key.toLowerCase() === 'u') {
                    if (history.length > 0 && inputValue === '') handleUndo();
                }
            };

            const canSwapThrower = p1Turns.length === 0 && p2Turns.length === 0 && appState === 'match' && !matchWinner;
            const setThrower = (idx) => {
                if (!canSwapThrower) return;
                setLegStartingIdx(idx);
                setCurrentPlayerIdx(idx);
            };

            const openEditModal = (pIdx, tIdx, oldScore) => {
                setEditingModal({ pIdx, tIdx, oldScore });
                setEditInputValue('');
            };

            const exportArchiveToCSV = () => {
                if (matchArchive.length === 0) {
                    alert("No completed matches to export.");
                    return;
                }

                let csvContent = "data:text/csv;charset=utf-8,";
                
                matchArchive.forEach((match, matchIdx) => {
                    if (matchIdx > 0) csvContent += "\n\n";

                    const p1 = { name: match.p1Name, sets: 0, legs: match.p1Legs, tons: 0, 100: 0, 140: 0, 180: 0, highOut: 0, best: 0, worst: 0, score: 0, darts: 0, dartsWon: 0, first9Score: 0, first9Darts: 0, keepWon: 0, keepAll: 0, breakWon: 0, breakAll: 0 };
                    const p2 = { name: match.p2Name, sets: 0, legs: match.p2Legs, tons: 0, 100: 0, 140: 0, 180: 0, highOut: 0, best: 0, worst: 0, score: 0, darts: 0, dartsWon: 0, first9Score: 0, first9Darts: 0, keepWon: 0, keepAll: 0, breakWon: 0, breakAll: 0 };
                    const playersExport = [p1, p2];

                    match.legs.forEach(leg => {
                        const starter = leg.starterIdx;
                        const winner = leg.winnerIdx;
                        
                        playersExport[starter].keepAll++;
                        playersExport[1 - starter].breakAll++;
                        
                        if (winner !== null) {
                            if (winner === starter) playersExport[starter].keepWon++;
                            else playersExport[winner].breakWon++;
                            
                            const winnerDarts = winner === 0 ? leg.p1Darts : leg.p2Darts;
                            playersExport[winner].dartsWon += winnerDarts;
                            
                            if (playersExport[winner].best === 0 || winnerDarts < playersExport[winner].best) playersExport[winner].best = winnerDarts;
                            if (winnerDarts > playersExport[winner].worst) playersExport[winner].worst = winnerDarts;
                            
                            const winningTurn = winner === 0 ? leg.p1Turns[leg.p1Turns.length - 1] : leg.p2Turns[leg.p2Turns.length - 1];
                            if (winningTurn && !winningTurn.isBust && winningTurn.scored !== 'BUST' && winningTurn.scored > playersExport[winner].highOut) {
                                playersExport[winner].highOut = winningTurn.scored;
                            }
                        }

                        const processTurns = (turns, pIdx) => {
                            turns.forEach((t, i) => {
                                playersExport[pIdx].darts += (t.checkoutDarts || 3);
                                if (!t.isBust && t.scored !== 'BUST') {
                                    playersExport[pIdx].score += t.scored;
                                    if (t.scored >= 100 && t.scored < 140) { playersExport[pIdx].tons++; playersExport[pIdx][100]++; }
                                    if (t.scored >= 140 && t.scored < 180) playersExport[pIdx][140]++;
                                    if (t.scored === 180) playersExport[pIdx][180]++;
                                }
                                if (i < 3) {
                                    playersExport[pIdx].first9Darts += 3;
                                    if (!t.isBust && t.scored !== 'BUST') playersExport[pIdx].first9Score += t.scored;
                                }
                            });
                        };
                        processTurns(leg.p1Turns, 0);
                        processTurns(leg.p2Turns, 1);
                    });

                    const ts = new Date(match.id);
                    const dateStr = `${ts.getDate().toString().padStart(2,'0')}/${(ts.getMonth()+1).toString().padStart(2,'0')}/${ts.getFullYear()} ${ts.getHours().toString().padStart(2,'0')}:${ts.getMinutes().toString().padStart(2,'0')}:${ts.getSeconds().toString().padStart(2,'0')}`;

                    const row = (colA, colB, colC, colD, colE) => { csvContent += `"${colA}","${colB}","${colC}","${colD}","${colE}"\n`; };
                    const statRow = (group, label, val1, val2) => { row(group, label, val1, label, val2); };

                    row(dateStr, p1.name, "", p2.name, "");
                    statRow("Totals", "Sets", p1.sets, p2.sets);
                    statRow("", "Legs", p1.legs, p2.legs);
                    statRow("", "Tons", p1.tons, p2.tons);
                    statRow("", "100+", p1[100], p2[100]);
                    statRow("", "140+", p1[140], p2[140]);
                    statRow("", "180's", p1[180], p2[180]);
                    statRow("", "High Out", p1.highOut, p2.highOut);
                    statRow("", "Best", p1.best || "", p2.best || "");
                    statRow("", "Worst", p1.worst || "", p2.worst || "");
                    
                    const keep1 = p1.keepAll > 0 ? ((p1.keepWon / p1.keepAll) * 100).toFixed(0) : 0;
                    const keep2 = p2.keepAll > 0 ? ((p2.keepWon / p2.keepAll) * 100).toFixed(0) : 0;
                    const break1 = p1.breakAll > 0 ? ((p1.breakWon / p1.breakAll) * 100).toFixed(0) : 0;
                    const break2 = p2.breakAll > 0 ? ((p2.breakWon / p2.breakAll) * 100).toFixed(0) : 0;

                    const avgD1 = p1.legs > 0 ? (p1.dartsWon / p1.legs).toFixed(1) : 0;
                    const avgD2 = p2.legs > 0 ? (p2.dartsWon / p2.legs).toFixed(1) : 0;
                    const avgS1 = p1.darts > 0 ? (p1.score / p1.darts).toFixed(2) : 0; 
                    const avgS2 = p2.darts > 0 ? (p2.score / p2.darts).toFixed(2) : 0;
                    const avgF1 = p1.first9Darts > 0 ? (p1.first9Score / p1.first9Darts).toFixed(2) : 0;
                    const avgF2 = p2.first9Darts > 0 ? (p2.first9Score / p2.first9Darts).toFixed(2) : 0;

                    statRow("Averages", "Darts", avgD1, avgD2);
                    statRow("", "Score", avgS1, avgS2);
                    statRow("", "First 9", avgF1, avgF2);
                    statRow("", "Check-Out", 0, 0);
                    statRow("", "Keep", keep1, keep2);
                    statRow("", "Break", break1, break2);

                    row("Finish Stats", "2-80 Success", 0, "2-80 Success", 0);
                    row("", "2-80 Failure", 0, "2-80 Failure", 0);
                    row("", "81-130 Success", 0, "81-130 Success", 0);
                    row("", "81-130 Failure", 0, "81-130 Failure", 0);
                    row("", "131+ Success", 0, "131+ Success", 0);
                    row("", "131+ Failure", 0, "131+ Failure", 0);

                    statRow("Counts", "Legs", match.legs.length, match.legs.length);
                    row("", "Darts Won", p1.dartsWon, "Darts Won", p2.dartsWon);
                    row("", "Score", p1.score, "Score", p2.score);
                    row("", "Darts", p1.darts, "Darts", p2.darts);
                    row("", "First 9 Score", p1.first9Score, "First 9 Score", p2.first9Score);
                    row("", "First 9 Darts", p1.first9Darts, "First 9 Darts", p2.first9Darts);
                    row("", "Check-Out", 0, "Check-Out", 0);
                    row("", "Double", 0, "Double", 0);
                    row("", "Keep Won", p1.keepWon, "Keep Won", p2.keepWon);
                    row("", "Keep All", p1.keepAll, "Keep All", p2.keepAll);
                    row("", "Break Won", p1.breakWon, "Break Won", p2.breakWon);
                    row("", "Break All", p1.breakAll, "Break All", p2.breakAll);

                    match.legs.forEach(leg => {
                        row("", "", "", "", "");
                        row("Round", "Scored", "To Go", "Scored", "To Go");
                        row("", leg.starterIdx === 0 ? "*" : "", leg.startScore, leg.starterIdx === 1 ? "*" : "", leg.startScore);
                        
                        const maxTurns = Math.max(leg.p1Turns.length, leg.p2Turns.length);
                        for(let i=0; i<maxTurns; i++) {
                            const t1 = leg.p1Turns[i];
                            const t2 = leg.p2Turns[i];
                            
                            const s1 = t1 ? (t1.isBust || t1.scored === 'BUST' ? "-1" : t1.scored) : "";
                            const tg1 = t1 ? t1.toGo : "";
                            const s2 = t2 ? (t2.isBust || t2.scored === 'BUST' ? "-1" : t2.scored) : "";
                            const tg2 = t2 ? t2.toGo : "";
                            
                            row(i+1, s1, tg1, s2, tg2);
                        }
                        
                        const d1 = leg.winnerIdx === 0 ? leg.p1Darts : "";
                        const d2 = leg.winnerIdx === 1 ? leg.p2Darts : "";
                        row("Darts", "", d1, "", d2);
                    });
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `bar-8-darts-archive_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            if (appState === 'setup') {
                return (
                    <div className="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col items-center justify-center p-6 font-sans text-slate-900 dark:text-slate-200 transition-colors duration-300">
                        <div className="absolute top-6 right-6 flex gap-4 z-10">
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-3 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-md text-slate-700 dark:text-slate-300 hover:text-blue-500 transition-colors">
                                {isDarkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                            </button>
                        </div>
                        
                        <div className="w-full max-w-3xl bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl dark:shadow-2xl p-8 lg:p-12 relative overflow-hidden transition-colors duration-300">
                            
                            <div className="absolute top-0 right-0 p-6 flex gap-3">
                                <button onClick={() => setAppState('archive')} className="flex items-center text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-slate-800/50 hover:bg-slate-200 dark:hover:bg-slate-700 px-4 py-2 rounded-xl transition-colors text-sm font-bold border border-slate-300 dark:border-slate-700">
                                    <Database className="w-4 h-4 mr-2 text-emerald-500 dark:text-emerald-400" /> Match Archive
                                </button>
                            </div>

                            <div className="flex items-center justify-center mb-10 pt-8">
                                <Target className="w-12 h-12 text-blue-600 dark:text-blue-500 mr-4" />
                                <h1 className="text-5xl font-black italic tracking-wider text-slate-900 dark:text-white">BAR 8 <span className="text-blue-600 dark:text-blue-500">DARTS</span></h1>
                            </div>
                            
                            <div className="space-y-8">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-2">
                                        <label className="text-sm font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider flex items-center">
                                            <Users className="w-4 h-4 mr-2 text-blue-500 dark:text-blue-400" /> Team 1 (Home)
                                        </label>
                                        <select 
                                            value={config.team1Id}
                                            onChange={(e) => setConfig({...config, team1Id: parseInt(e.target.value)})}
                                            className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-lg font-semibold text-slate-900 dark:text-white focus:outline-none focus:border-blue-500 appearance-none transition-colors"
                                        >
                                            {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-sm font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider flex items-center">
                                            <Users className="w-4 h-4 mr-2 text-red-500 dark:text-red-400" /> Team 2 (Away)
                                        </label>
                                        <select 
                                            value={config.team2Id}
                                            onChange={(e) => setConfig({...config, team2Id: parseInt(e.target.value)})}
                                            className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-lg font-semibold text-slate-900 dark:text-white focus:outline-none focus:border-red-500 appearance-none transition-colors"
                                        >
                                            {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                    </div>
                                </div>
                                
                                <div className="flex justify-center">
                                    <button onClick={() => setAppState('teams')} className="text-blue-600 dark:text-blue-400 hover:text-blue-500 dark:hover:text-blue-300 text-sm font-bold flex items-center underline underline-offset-4">
                                        <Settings className="w-4 h-4 mr-1" /> Manage League Teams
                                    </button>
                                </div>
                                
                                <div className="grid grid-cols-1 gap-6 pt-6 border-t border-slate-200 dark:border-slate-800">
                                    <div className="space-y-3">
                                        <label className="text-sm font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider flex items-center">
                                            <Activity className="w-4 h-4 mr-2 text-green-500 dark:text-green-400" /> Starting Score
                                        </label>
                                        <div className="flex gap-2">
                                            {[301, 501, 701].map(score => (
                                                <button
                                                    key={score}
                                                    onClick={() => setConfig({...config, startingScore: score})}
                                                    className={`flex-1 py-3 rounded-xl font-bold border-2 transition-all ${
                                                        config.startingScore === score 
                                                            ? 'bg-blue-600 border-blue-600 text-white shadow-md' 
                                                            : 'bg-white dark:bg-slate-950 border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:border-slate-400 dark:hover:border-slate-500'
                                                    }`}
                                                >
                                                    {score}
                                                </button>
                                            ))}
                                            <div className="relative flex-1">
                                                <input 
                                                    type="number" 
                                                    value={config.startingScore}
                                                    onChange={(e) => setConfig({...config, startingScore: parseInt(e.target.value) || 0})}
                                                    className="w-full h-full bg-white dark:bg-slate-950 border-2 border-slate-300 dark:border-slate-700 rounded-xl px-4 text-center text-lg font-bold text-slate-900 dark:text-white focus:outline-none focus:border-blue-500 transition-colors"
                                                />
                                                <span className="absolute -top-2 left-1/2 -translate-x-1/2 bg-white dark:bg-slate-900 px-1 text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase">Custom</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="space-y-3">
                                        <label className="text-sm font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider flex items-center">
                                            <Target className="w-4 h-4 mr-2 text-yellow-500 dark:text-yellow-400" /> Match Format
                                        </label>
                                        <select 
                                            value={config.bestOf}
                                            onChange={(e) => setConfig({...config, bestOf: parseInt(e.target.value)})}
                                            className="w-full bg-slate-50 dark:bg-slate-950 border-2 border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-lg font-semibold text-slate-900 dark:text-white focus:outline-none focus:border-yellow-500 appearance-none transition-colors"
                                        >
                                            {[1,3,5,7,9].map(num => <option key={num} value={num}>Best of {num} Legs</option>)}
                                        </select>
                                    </div>
                                </div>
                                
                                <button onClick={startMatch} className="w-full mt-8 bg-blue-600 hover:bg-blue-500 text-white font-black text-2xl py-6 rounded-xl transition-all shadow-lg hover:shadow-xl hover:shadow-blue-500/30 dark:shadow-[0_0_20px_rgba(59,130,246,0.3)] dark:hover:shadow-[0_0_30px_rgba(59,130,246,0.5)] flex items-center justify-center">
                                    START MATCH <ArrowRight className="w-8 h-8 ml-3" />
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (appState === 'teams') {
                return (
                    <div className="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col items-center p-6 font-sans text-slate-900 dark:text-slate-200 transition-colors duration-300">
                        <div className="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl dark:shadow-2xl p-8 mt-10 transition-colors duration-300">
                            <div className="flex justify-between items-center mb-8 border-b border-slate-200 dark:border-slate-800 pb-6">
                                <h2 className="text-3xl font-black text-slate-900 dark:text-white flex items-center">
                                    <Users className="w-8 h-8 text-blue-600 dark:text-blue-500 mr-3" /> Manage Teams
                                </h2>
                                <button onClick={() => setAppState('setup')} className="px-6 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-xl font-bold text-slate-700 dark:text-slate-300 transition-colors">
                                    Back to Setup
                                </button>
                            </div>
                            
                            <form onSubmit={handleAddTeam} className="flex gap-4 mb-6">
                                <input 
                                    type="text" 
                                    value={newTeamName}
                                    onChange={(e) => setNewTeamName(e.target.value)}
                                    placeholder="Enter new team name..."
                                    className="flex-grow bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-lg text-slate-900 dark:text-white focus:outline-none focus:border-blue-500 transition-colors"
                                />
                                <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-6 rounded-xl font-bold flex items-center transition-colors">
                                    <Plus className="w-5 h-5 mr-1" /> Add
                                </button>
                            </form>
                            
                            <div className="flex gap-3 mb-6 pb-6 border-b border-slate-200 dark:border-slate-800">
                                <button onClick={resetTeamsToDefault} className="text-sm px-4 py-2 bg-slate-600 text-white rounded-lg hover:bg-slate-500 transition-colors font-bold">
                                    Restore Default Teams
                                </button>
                                <button onClick={clearAllTeams} className="text-sm px-4 py-2 bg-red-900 text-white rounded-lg hover:bg-red-800 transition-colors font-bold">
                                    Clear All
                                </button>
                            </div>

                            <div className="space-y-3">
                                {teams.length === 0 && <p className="text-slate-500 italic text-center py-4">No teams available. Add some above!</p>}
                                {teams.map(team => (
                                    <div key={team.id} className="flex justify-between items-center bg-slate-50 dark:bg-slate-950 p-4 rounded-xl border border-slate-300 dark:border-slate-800 transition-colors">
                                        <span className="text-lg font-bold text-slate-800 dark:text-slate-300">{team.name}</span>
                                        <button onClick={() => handleRemoveTeam(team.id)} className="text-red-500 hover:text-red-400 p-2 hover:bg-red-100 dark:hover:bg-red-950/30 rounded-lg transition-colors">
                                            <Trash2 className="w-5 h-5" />
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (appState === 'archive') {
                return (
                    <div className="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col items-center p-6 font-sans text-slate-900 dark:text-slate-200 transition-colors duration-300">
                        <div className="w-full max-w-6xl bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl dark:shadow-2xl p-8 mt-4 flex flex-col h-[90vh] transition-colors duration-300">
                            
                            <div className="flex justify-between items-center mb-8 border-b border-slate-200 dark:border-slate-800 pb-6 shrink-0 flex-wrap gap-4">
                                <h2 className="text-3xl font-black text-slate-900 dark:text-white flex items-center">
                                    <Database className="w-8 h-8 text-emerald-600 dark:text-emerald-500 mr-3" /> Match Archive
                                </h2>
                                <div className="flex gap-3">
                                    <button onClick={clearArchive} className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl font-bold transition-colors">
                                        Clear Archive
                                    </button>
                                    <button onClick={exportArchiveToCSV} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold transition-colors flex items-center text-white">
                                        <Download className="w-5 h-5 mr-2" /> Export to CSV
                                    </button>
                                    <button onClick={() => setAppState('setup')} className="px-4 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl font-bold transition-colors flex items-center">
                                        <ChevronLeft className="w-5 h-5 mr-1" /> Back
                                    </button>
                                </div>
                            </div>

                            <div className="flex-grow overflow-y-auto custom-scrollbar pr-2 space-y-6">
                                {matchArchive.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-slate-400 dark:text-slate-500">
                                        <Database className="w-16 h-16 mb-4 opacity-50" />
                                        <p className="text-xl font-bold">No matches saved yet.</p>
                                    </div>
                                ) : (
                                    matchArchive.slice().reverse().map((match, idx) => (
                                        <div key={idx} className="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-2xl p-6 transition-colors">
                                            <div className="flex justify-between items-end border-b border-slate-200 dark:border-slate-800 pb-4 mb-4">
                                                <div>
                                                    <span className="text-xs font-bold text-slate-500 uppercase tracking-widest">{match.date} • {match.format}</span>
                                                    <div className="text-2xl font-black mt-1 text-slate-900 dark:text-white">

                                                        <span className="mx-4 text-slate-400 dark:text-slate-600">vs</span>

                            >
                                <div className={`p-4 md:p-6 text-center border-b flex flex-col items-center justify-center relative ${currentPlayerIdx === 1 ? 'border-red-200 dark:border-red-900/50 bg-red-50 dark:bg-red-950/20' : 'border-slate-200 dark:border-slate-800/50 bg-slate-50 dark:bg-slate-900/30'}`}>
                                    <h2 className={`text-2xl md:text-4xl font-black tracking-tight ${currentPlayerIdx === 1 ? 'text-slate-900 dark:text-white' : 'text-slate-500 dark:text-slate-400'}`}>{players[1].name}</h2>
                                    {legStartingIdx === 1 && <span className="absolute top-2 right-2 text-xs uppercase font-bold text-red-600 dark:text-red-500 bg-red-100 dark:bg-red-950/50 px-3 py-1 rounded border border-red-200 dark:border-red-900">First</span>}

                                            <Database className="w-6 h-6 mr-2" /> Archive
                                        </button>
                                        <button onClick={() => setAppState('setup')} className="px-4 py-4 md:px-6 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-white rounded-xl font-bold flex items-center shadow-lg transition-colors">
                                            <RotateCcw className="w-6 h-6 mr-2" /> New Match
                                        </button>
                                    </div>
                                </div>
                            ) : legWonOverlay ? (
                                <div className="bg-emerald-100/95 dark:bg-emerald-900/95 border-2 border-emerald-400 dark:border-emerald-500/50 rounded-3xl p-4 md:p-6 shadow-2xl flex flex-col md:flex-row items-center justify-between backdrop-blur-sm gap-4">
                                    <div className="flex items-center">
                                        <Target className="w-16 h-16 md:w-20 md:h-20 text-emerald-600 dark:text-white mr-6" />
                                        <div>
                                            <h3 className="text-3xl md:text-5xl font-black text-emerald-900 dark:text-white leading-none">LEG WON!</h3>
                                            <p className="text-emerald-700 dark:text-emerald-200 text-lg md:text-xl font-bold mt-2">
                                                <span className="text-emerald-900 dark:text-white">{legWonOverlay.winnerName}</span> checked out in <span className="text-white bg-emerald-600 dark:bg-emerald-700 px-2 py-0.5 rounded">{legWonOverlay.darts} darts</span>
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex gap-4 items-center relative">
                                        <button onClick={handleNextLegOrMatch} className="px-8 py-5 md:py-6 bg-emerald-600 hover:bg-emerald-500 border-2 border-emerald-500 dark:border-emerald-400 rounded-2xl text-2xl md:text-3xl font-black text-white transition-all transform hover:scale-105 shadow-xl flex items-center">
                                            {legWonOverlay.isMatchWin ? "FINISH MATCH" : "NEXT LEG"} <ArrowRight className="w-8 h-8 ml-3" />
                                        </button>
                                        <p className="absolute -bottom-6 right-0 text-emerald-600/50 dark:text-emerald-400/50 text-sm font-bold uppercase tracking-widest hidden md:block">Press Enter</p>
                                    </div>
                                </div>
                            ) : checkoutPrompt ? (
                                <div className="bg-blue-100/95 dark:bg-blue-900/95 border-2 border-blue-400 dark:border-blue-500/50 rounded-3xl p-4 md:p-6 shadow-2xl flex flex-col md:flex-row items-center justify-between backdrop-blur-sm gap-4">
                                    <div className="flex items-center w-full md:w-auto">
                                        <Target className="w-12 h-12 md:w-20 md:h-20 text-blue-600 dark:text-white mr-4 md:mr-6 animate-pulse shrink-0" />
                                        <div>
                                            <h3 className="text-2xl md:text-5xl font-black text-blue-900 dark:text-white leading-none">GAME SHOT!</h3>
                                            <p className="text-blue-700 dark:text-blue-200 text-sm md:text-xl font-bold mt-1">Darts thrown in final turn?</p>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 md:gap-4 items-center">
                                        {[1, 2, 3].map(num => (
                                            <button key={num} onClick={() => handleCheckout(num)} className="w-16 h-16 md:w-24 md:h-24 bg-blue-600 dark:bg-blue-800 hover:bg-blue-500 dark:hover:bg-blue-600 border-2 border-blue-500 dark:border-blue-400 rounded-xl md:rounded-2xl text-2xl md:text-4xl font-black text-white transition-all transform hover:scale-105 shadow-xl">
                                                {num}
                                            </button>
                                        ))}
                                        <button onClick={handleUndo} className="w-16 h-16 md:w-24 md:h-24 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 border-2 border-slate-300 dark:border-slate-700 rounded-xl md:rounded-2xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white flex items-center justify-center transition-colors shadow-md">
                                            <Undo2 className="w-6 h-6 md:w-8 md:h-8" />
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex flex-col md:flex-row gap-4 justify-center items-center w-full">
                                    {/* Desktop visible / Mobile top - Input Display */}
                                    <div className="bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-3xl w-full md:w-[400px] flex items-center justify-between px-6 shadow-inner transition-colors h-[100px] md:h-[120px] shrink-0">
                                        <div className="text-[60px] md:text-[80px] leading-none font-black text-slate-800 dark:text-slate-100 tabular-nums truncate">
                                            {inputValue || "0"}
                                        </div>
                                        <button onClick={handleUndo} disabled={history.length === 0} className="p-4 rounded-2xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white disabled:opacity-30 transition-colors shrink-0">
                                            <Undo2 className="w-6 h-6" />
                                        </button>
                                    </div>
                                    
                                    {/* Responsive Mobile Numpad */}
                                    <div className="md:hidden flex-grow bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-3 flex gap-3 shadow-xl transition-colors w-full">
                                        <div className="grid grid-cols-5 gap-3 flex-grow">
                                            {[1,2,3,4,5,6,7,8,9,0].map(num => (
                                                <button key={num} onClick={() => handleNumpad(num.toString())} className="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:bg-slate-300 dark:active:bg-slate-600 rounded-xl text-2xl font-bold text-slate-700 dark:text-white transition-colors shadow-sm py-3">
                                                    {num}
                                                </button>
                                            ))}
                                        </div>
                                        <div className="w-[100px] flex flex-col gap-3">
                                            <button onClick={() => setInputValue('')} className="flex-grow bg-red-50 dark:bg-red-950/40 hover:bg-red-100 dark:hover:bg-red-900/60 text-red-600 dark:text-red-500 rounded-xl text-xl font-bold transition-colors">
                                                CLR
                                            </button>
                                            <button onClick={handleScoreSubmit} className="h-[70px] bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-2xl font-black transition-colors shadow-lg shadow-blue-500/20">
                                                ENT
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {}
                        {editingModal && (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                                <div className="bg-white dark:bg-slate-900 border-2 border-blue-500 rounded-3xl p-6 shadow-2xl max-w-sm w-full animate-in fade-in zoom-in duration-200">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-2xl font-black text-slate-900 dark:text-white">Edit Score</h3>
                                        <div className="text-sm font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-lg">
                                            {players[editingModal.pIdx].name} • Turn {editingModal.tIdx + 1}
                                        </div>
                                    </div>
                                    
                                    <div className="bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-2xl h-24 mb-4 flex items-center justify-center shadow-inner">
                                        <span className="text-6xl font-black text-slate-800 dark:text-slate-100 tabular-nums">
                                            {editInputValue || "0"}
                                        </span>
                                    </div>
                                    <p className="text-center text-sm font-bold text-slate-500 dark:text-slate-400 mb-6 uppercase tracking-widest">
                                        Original: {editingModal.oldScore}
                                    </p>
                                    
                                    <div className="grid grid-cols-3 gap-2 mb-4">
                                        {[1,2,3,4,5,6,7,8,9,'CLR',0].map(num => (
                                            <button 
                                                key={num} 
                                                onClick={() => num === 'CLR' ? setEditInputValue('') : handleEditNumpad(num.toString())} 
                                                className={`h-14 rounded-xl text-xl font-bold transition-colors ${num === 'CLR' ? 'bg-red-100 dark:bg-red-950/40 text-red-600 dark:text-red-500 hover:bg-red-200 dark:hover:bg-red-900/60' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-white hover:bg-slate-300 dark:hover:bg-slate-700'}`}
                                            >
                                                {num}
                                            </button>
                                        ))}
                                    </div>
                                    
                                    <div className="flex gap-3">
                                        <button onClick={() => setEditingModal(null)} className="flex-1 py-4 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-white rounded-xl font-bold transition-colors">
                                            Cancel
                                        </button>
                                        <button onClick={submitEdit} className="flex-1 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-black shadow-lg shadow-blue-500/20 transition-colors">
                                            UPDATE
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Bar8DartsDashboard />);
    </script>
</body>
</html>
